# oteca-api（UPDATE_v2 §10・SPEC §11-9）：レート対戦の受付係とランキング。Cloudflare の無料プラン
name = "oteca-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# 受付係（Durable Object。無料プランは SQLite 保存だけ）
[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker"]

# 届け係（v2.7。ゲームを開いている人に、トロフィあげが届いたことを すぐ知らせる。WebSocket の休止機能）
[[durable_objects.bindings]]
name = "GIFT_HUB"
class_name = "GiftHub"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GiftHub"]

# ランキングのデータベース
[[d1_databases]]
binding = "DB"
database_name = "oteca-ranking"
database_id = "9684c766-0a9f-418d-9d55-0d71c751c104"
migrations_dir = "migrations"

# まとめ処理：毎日 UTC 19:00 ＝ 日本時間 4:00、UTC 7:00 ＝ 日本時間 16:00（1日2回。src/config/rating.ts の batchHoursJst と同じにする）
[triggers]
crons = ["0 19 * * *", "0 7 * * *"]

# 公開しているゲームの版（v2.7）：受付係がこれを読んで、古い版の人のレート対戦の申し込みを断る（ゲームをデプロイすると自動で新しくなる）
[vars]
GAME_VERSION_URL = "https://yosuke444.github.io/oteca/version.json"

# 管理キーは wrangler secret put ADMIN_KEY で設定する（ここには書かない）
